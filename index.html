<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitations — Chadrack & Dina</title>
<style>
:root{--gold:#dfb76c;--dark:#101010;--card:rgba(255,255,255,.08)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Georgia,serif;color:#fff;background:linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.82)),url('https://i.postimg.cc/qRKcV7yY/mariagephoto.jpg') center/cover fixed}
.container{width:min(900px,92%);margin:auto;padding:45px 0 60px}.header{text-align:center;margin-bottom:32px}.eyebrow{text-transform:uppercase;letter-spacing:4px;color:var(--gold);font-size:.78rem}.header h1{font-size:clamp(2rem,5vw,3.2rem);margin:10px 0}.header p{color:#ddd;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid rgba(223,183,108,.28);border-radius:18px;padding:22px;box-shadow:0 12px 35px rgba(0,0,0,.35)}.name{font-size:1.12rem;font-weight:bold;margin-bottom:10px}.table{color:var(--gold);text-transform:uppercase;letter-spacing:2px;font-size:.78rem;margin-bottom:18px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{display:inline-block;text-decoration:none;border:0;border-radius:25px;padding:11px 15px;font-weight:bold;cursor:pointer;font-family:inherit}.open{background:#fff;color:#222}.copy{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}.copy.ok{border-color:var(--gold);color:var(--gold)}.footer{text-align:center;color:#aaa;font-size:.8rem;margin-top:35px}.footer span{color:var(--gold)}
</style>
</head>
<body>
<div class="container">
<header class="header">
<div class="eyebrow">Mariage Royal</div>
<h1>Chadrack &amp; Dina</h1>
<p>Gestion des invitations personnalisées<br>2 invités • 2 invitations • 2 tables</p>
</header>
<section class="grid">
  <article class="card">
    <div class="name">MIMI META</div>
    <div class="table">Table CHRONIQUE</div>
    <div class="actions">
      <a class="btn open" href="Invitation-MIMI-META.html">Ouvrir</a>
      <button class="btn copy" data-file="Invitation-MIMI-META.html">Copier le lien</button>
    </div>
  </article>
  <article class="card">
    <div class="name">JULIANA KAMBU</div>
    <div class="table">Table EXODE</div>
    <div class="actions">
      <a class="btn open" href="Invitation-JULIANA-KAMBU.html">Ouvrir</a>
      <button class="btn copy" data-file="Invitation-JULIANA-KAMBU.html">Copier le lien</button>
    </div>
  </article>
</section>
<footer class="footer">Chadrack &amp; Dina • <span>04 Octobre 2026</span></footer>
</div>
<script>
document.querySelectorAll('.copy').forEach(btn=>btn.addEventListener('click',async()=>{const url=new URL(btn.dataset.file,location.href).href;try{await navigator.clipboard.writeText(url);btn.textContent='Lien copié ✓';btn.classList.add('ok');setTimeout(()=>{btn.textContent='Copier le lien';btn.classList.remove('ok')},1800)}catch(e){prompt('Copiez ce lien :',url)}}));
</script>
</body>
</html>
